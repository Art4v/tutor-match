<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MatchTutor — Tutor Card Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    --card: #F4F1E8;
    --ink: #2C3F2A;
    --ink-2: #455041;
    --muted: #8A9180;
    --green: #3E5C3A;
    --green-2: #5C7349;
    --line: #E0DACB;
    --panel: #EFECE2;
  }
  html, body { margin: 0; height: 100%; background: #e4dfd2; }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  .tcard {
    background: var(--card);
    border: 1px solid #E2DDD0;
    box-shadow: 0 6px 20px rgba(44,55,35,0.09);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; }
  image-slot { background: #d8d2c4; }
</style>
</head>
<body>
<div id="root"></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="cards2.jsx"></script>
<script type="text/babel" src="cards3.jsx"></script>
<script type="text/babel">
function Frame({ children, w, h }) {
  return (
    <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      {children}
    </div>
  );
}

function App() {
  return (
    <DesignCanvas bg="#e4dfd2">
      <DCSection id="ref" title="MatchTutor — Tutor card layouts"
        subtitle="Smaller cards · large centred photo · no bio · awards enlarged. Drop your own headshot onto any avatar; download a card from its ⋯ menu.">
        <DCArtboard id="old" label="Before · current card (447×487)" width={447} height={487}>
          <div style={{ width: '100%', height: '100%' }}>
            <img src="uploads/pasted-1781499247879-0.png" alt="current card" style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="vertical" title="Vertical cards — photo on top, tagline header" subtitle="Portrait / compact. Big profile photo up top; the tagline gets its own header treatment; ATAR · price · subjects · CTA restacked below. Drop a headshot onto any photo.">
        <DCArtboard id="v1" label="Option 1 · Hero (name on photo)" width={374} height={520}>
          <Frame><VHero /></Frame>
        </DCArtboard>
        <DCArtboard id="v2" label="Option 2 · Stack (clean photo + stat row)" width={366} height={520}>
          <Frame><VStack /></Frame>
        </DCArtboard>
        <DCArtboard id="v3" label="Option 3 · Crown (circle on colour, centred)" width={360} height={560}>
          <Frame><VCrown /></Frame>
        </DCArtboard>
        <DCArtboard id="v4" label="Option 4 · Green stat band" width={368} height={520}>
          <Frame><VBand /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="layouts" title="Listing row — left colour options" subtitle="Coloured left panel with the leaf logo; the photo now fills the segment. Verified badge is bold; one example shows the 'Not verified' state.">
        <DCArtboard id="c1" label="Forest" width={592} height={254}>
          <Frame><ShapeRow id="r-forest" leftBg="#3E5C3A" ring="var(--card)" /></Frame>
        </DCArtboard>
        <DCArtboard id="c2" label="Deep pine" width={592} height={254}>
          <Frame><ShapeRow id="r-pine" leftBg="#234C38" ring="var(--card)" /></Frame>
        </DCArtboard>
        <DCArtboard id="c3" label="Sage" width={592} height={254}>
          <Frame><ShapeRow id="r-sage" leftBg="#7C9277" ring="#ffffff" /></Frame>
        </DCArtboard>
        <DCArtboard id="c4" label="Soft sage (light)" width={592} height={254}>
          <Frame><ShapeRow id="r-soft" leftBg="#DCE6D2" ring="#ffffff" lightPanel /></Frame>
        </DCArtboard>
        <DCArtboard id="c5" label="Blush" width={592} height={254}>
          <Frame><ShapeRow id="r-blush" leftBg="#C98B86" ring="var(--card)" /></Frame>
        </DCArtboard>
        <DCArtboard id="c6" label="Gradient (sage → forest)" width={592} height={254}>
          <Frame><ShapeRow id="r-grad" leftBg="linear-gradient(155deg,#7C9277,#2C3F2A)" ring="var(--card)" /></Frame>
        </DCArtboard>
        <DCArtboard id="c7" label="Not verified (state example)" width={592} height={254}>
          <Frame><ShapeRow id="r-unver" leftBg="#3E5C3A" ring="var(--card)" verified={false} /></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="others" title="Other shapes (for reference)" subtitle="The alternates, if you change your mind.">
        <DCArtboard id="l2" label="Photo split" width={444} height={320}>
          <Frame><ShapeSplit /></Frame>
        </DCArtboard>
        <DCArtboard id="l3" label="Photo top" width={336} height={440}>
          <Frame><ShapePhotoTop /></Frame>
        </DCArtboard>
        <DCArtboard id="l4" label="Minimal" width={348} height={380}>
          <Frame><ShapeMinimal /></Frame>
        </DCArtboard>
        <DCArtboard id="l5" label="Stat band" width={348} height={400}>
          <Frame><ShapeBand /></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
