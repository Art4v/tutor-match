<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MatchTutor — Logo Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="marks.jsx"></script>
<script type="text/babel">
const { useState } = React;

// ---------- Brand palettes (color experiments) ----------
const PALETTES = [
  { key:'indigo',  name:'Indigo · Coral', ink:'#191A23', primary:'#4F46E5', accent:'#FF6B5C', onPrimary:'#ffffff' },
  { key:'teal',    name:'Teal · Amber',   ink:'#15211F', primary:'#0E9488', accent:'#F59E0B', onPrimary:'#ffffff' },
  { key:'violet',  name:'Violet · Gold',  ink:'#1E1B2E', primary:'#7C3AED', accent:'#FBBF24', onPrimary:'#ffffff' },
  { key:'cobalt',  name:'Cobalt · Rose',  ink:'#15203A', primary:'#2563EB', accent:'#FB7185', onPrimary:'#ffffff' },
  { key:'emerald', name:'Emerald · Sun',  ink:'#10241B', primary:'#0F9D58', accent:'#FBBF24', onPrimary:'#ffffff' },
  { key:'ink',     name:'Ink · Amber',    ink:'#15161A', primary:'#222631', accent:'#F59E0B', onPrimary:'#ffffff' },
];
const LEAD = PALETTES[0];

// ---------- small layout helper ----------
function Stage({ children, cap, bg, pad = 26, gap = 16 }) {
  return (
    <div style={{ width:'100%', height:'100%', background: bg || '#fff', boxSizing:'border-box',
                  display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                  gap, padding: pad }}>
      {children}
      {cap && <div style={{ fontFamily:'ui-monospace,Menlo,monospace', fontSize:10.5, letterSpacing:'0.06em',
                            color:'#a39e95', textAlign:'center', textTransform:'uppercase' }}>{cap}</div>}
    </div>
  );
}

function MiniWord({ pal, reverse }) {
  return (
    <div style={{ fontFamily:"'Plus Jakarta Sans',sans-serif", fontWeight:800, fontSize:21, letterSpacing:'-0.03em' }}>
      <span style={{ color: reverse ? '#fff' : pal.primary }}>Match</span>
      <span style={{ color: reverse ? 'rgba(255,255,255,.9)' : pal.ink }}>Tutor</span>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>

      {/* ============ RECOMMENDED ============ */}
      <DCSection id="hero" title="MatchTutor — Logo" subtitle="Graduation cap meets chat bubble: learning + conversation. Pick a direction, a colorway, then we refine one.">
        <DCArtboard id="hero-main" label="Recommended · cap-in-bubble" width={600} height={380}>
          <Stage gap={26}>
            <MarkBubbleCap pal={LEAD} size={150} />
            <Lockup pal={LEAD} height={60} />
            <div style={{ fontFamily:'ui-monospace,Menlo,monospace', fontSize:11, letterSpacing:'0.05em', color:'#a39e95', textTransform:'uppercase' }}>
              the mortarboard says “tutor”, the bubble says “message &amp; match”
            </div>
          </Stage>
        </DCArtboard>
      </DCSection>

      {/* ============ ICON CONCEPTS ============ */}
      <DCSection id="concepts" title="Icon directions" subtitle="Same motif, six executions — all in the lead colorway for now.">
        <DCArtboard id="c-a" label="A · Solid bubble" width={300} height={320}>
          <Stage cap="filled chat bubble"><MarkBubbleCap pal={LEAD} size={150} /></Stage>
        </DCArtboard>
        <DCArtboard id="c-b" label="B · Outlined bubble + tail" width={300} height={320}>
          <Stage cap="speech bubble, drop tail"><MarkRectCap pal={LEAD} size={150} /></Stage>
        </DCArtboard>
        <DCArtboard id="c-c" label="C · Accent fill" width={300} height={320}>
          <Stage cap="colour swap"><MarkBubbleDuo pal={LEAD} size={150} /></Stage>
        </DCArtboard>
        <DCArtboard id="c-d" label="D · Line / minimal" width={300} height={320}>
          <Stage cap="single-weight outline"><MarkLine pal={LEAD} size={150} /></Stage>
        </DCArtboard>
        <DCArtboard id="c-e" label="E · Two bubbles (match)" width={300} height={320}>
          <Stage cap="two people, one chat"><MarkTwoBubbles pal={LEAD} size={170} /></Stage>
        </DCArtboard>
        <DCArtboard id="c-f" label="F · MT monogram + cap" width={300} height={320}>
          <Stage cap="letters with the cap on"><MarkMonogram pal={LEAD} size={184} /></Stage>
        </DCArtboard>
      </DCSection>

      {/* ============ COLORWAYS ============ */}
      <DCSection id="colors" title="Colourways" subtitle="The lead mark across six palettes. Mix bubble + cap colours freely.">
        {PALETTES.map((p) => (
          <DCArtboard key={p.key} id={`col-${p.key}`} label={p.name} width={280} height={320}>
            <Stage gap={20}>
              <MarkBubbleCap pal={p} size={132} />
              <MiniWord pal={p} />
              <div style={{ fontFamily:'ui-monospace,Menlo,monospace', fontSize:10, letterSpacing:'0.05em', color:'#b4afa6' }}>
                {p.primary} · {p.accent}
              </div>
            </Stage>
          </DCArtboard>
        ))}
      </DCSection>

      {/* ============ IN USE ============ */}
      <DCSection id="inuse" title="In use" subtitle="How the lead mark behaves as a wordmark, on dark, and as an app icon.">
        <DCArtboard id="u-light" label="Horizontal lockup" width={520} height={200}>
          <Stage><Lockup pal={LEAD} height={66} /></Stage>
        </DCArtboard>
        <DCArtboard id="u-dark" label="On dark" width={520} height={200}>
          <Stage bg={LEAD.ink}><Lockup pal={LEAD} height={66} reverse /></Stage>
        </DCArtboard>
        <DCArtboard id="u-app" label="App icon + favicon" width={420} height={260}>
          <Stage gap={22}>
            <div style={{ display:'flex', alignItems:'flex-end', gap:24 }}>
              <AppIcon pal={LEAD} size={108} />
              <AppIcon pal={LEAD} size={64} />
              <AppIcon pal={LEAD} size={32} />
            </div>
            <AppIcon pal={LEAD} size={56} bg={LEAD.ink} />
          </Stage>
        </DCArtboard>
        <DCArtboard id="u-mono" label="Monochrome" width={420} height={260}>
          <Stage gap={26}>
            <Lockup pal={{ ...LEAD, primary:'#1b1b1f', accent:'#1b1b1f', ink:'#1b1b1f' }} height={48} />
            <div style={{ background:'#1b1b1f', padding:'18px 26px', borderRadius:8 }}>
              <Lockup pal={{ ...LEAD, primary:'#fff', accent:'#fff', onPrimary:'#1b1b1f' }} height={40} reverse />
            </div>
          </Stage>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
